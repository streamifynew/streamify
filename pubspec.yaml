name: streamify
description: A modern streaming application inspired by MovieBox and FlixFox.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0             # APIs se movie data fetch karne ke liye
  video_player: ^2.8.2      # Videos play karne ke liye
  cached_network_image: ^3.3.1 # Movie posters smoothly load aur cache karne ke liye
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/        # Agar aap local banners/logos rakhna chahein

